services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: logistpulse
      POSTGRES_USER: logistpulse
      POSTGRES_PASSWORD: logistpulse
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/ejemplos.sql:/docker-entrypoint-initdb.d/02-ejemplos.sql:ro
